<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - My Dashboard</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <style>
    .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
    .login-card { width: min(420px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 24px; box-shadow: var(--shadow); }
    .login-card h1 { margin: 0 0 6px; font-size: 28px; }
    .login-card p { margin: 0 0 18px; color: var(--muted); }
    .login-card .text-input { margin-bottom: 12px; }
    .login-card .btn { width: 100%; }
    #msg { min-height: 20px; margin-top: 10px; font-size: 13px; color: var(--red); }
  </style>
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="loginForm">
      <h1>My Dashboard</h1>
      <p>Enter your dashboard password to continue.</p>
      <label class="field-label" for="password">Password</label>
      <input id="password" class="text-input" type="password" autocomplete="current-password" required />
      <button class="btn" type="submit">Sign in</button>
      <div id="msg"></div>
    </form>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      msg.textContent = '';
      const password = document.getElementById('password').value;
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        if (!res.ok) {
          const out = await res.json().catch(() => ({}));
          msg.textContent = out.detail || 'Login failed';
          return;
        }
        location.href = '/';
      } catch (err) {
        msg.textContent = err.message || 'Login failed';
      }
    });
  </script>
</body>
</html>
